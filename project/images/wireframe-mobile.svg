<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 750" width="380" height="750">
  <!-- Background Mobile Shell -->
  <rect x="10" y="10" width="360" height="730" rx="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="20" y="30" width="340" height="50" fill="#f0f0f0" stroke="#666666" stroke-width="1.5"/>
  <rect x="35" y="42" width="110" height="26" fill="#cccccc"/>
  <text x="45" y="59" font-family="sans-serif" font-size="11" fill="#333333">[ Logo ]</text>
  <!-- Hamburger Menu Icon -->
  <line x1="320" y1="45" x2="345" y2="45" stroke="#333333" stroke-width="3"/>
  <line x1="320" y1="55" x2="345" y2="55" stroke="#333333" stroke-width="3"/>
  <line x1="320" y1="65" x2="345" y2="65" stroke="#333333" stroke-width="3"/>

  <!-- Hero Section -->
  <rect x="20" y="95" width="340" height="150" fill="#fafafa" stroke="#999999" stroke-width="1.5" stroke-dasharray="4"/>
  <rect x="35" y="115" width="200" height="16" fill="#444444"/>
  <rect x="35" y="140" width="280" height="10" fill="#aaaaaa"/>
  <rect x="35" y="155" width="240" height="10" fill="#aaaaaa"/>
  <!-- CTA Button -->
  <rect x="35" y="180" width="120" height="35" rx="4" fill="#666666"/>
  <text x="55" y="202" font-family="sans-serif" font-size="12" fill="#ffffff">CTA Button</text>

  <!-- Section Title 1 -->
  <rect x="20" y="265" width="160" height="16" fill="#333333"/>
  
  <!-- Product Cards Grid (1 Column for Mobile) -->
  <!-- Card 1 -->
  <rect x="20" y="295" width="340" height="80" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="20" y1="295" x2="100" y2="375" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="100" y1="295" x2="20" y2="375" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="20" y="295" width="80" height="80" fill="none" stroke="#cccccc" stroke-width="1"/>
  <text x="35" y="340" font-family="sans-serif" font-size="10" fill="#888888">Image</text>
  <rect x="115" y="310" width="150" height="12" fill="#555555"/>
  <rect x="115" y="330" width="220" height="8" fill="#bbbbbb"/>
  <rect x="115" y="345" width="180" height="8" fill="#bbbbbb"/>

  <!-- Card 2 -->
  <rect x="20" y="390" width="340" height="80" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="20" y1="390" x2="100" y2="470" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="100" y1="390" x2="20" y2="470" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="20" y="390" width="80" height="80" fill="none" stroke="#cccccc" stroke-width="1"/>
  <text x="35" y="435" font-family="sans-serif" font-size="10" fill="#888888">Image</text>
  <rect x="115" y="405" width="150" height="12" fill="#555555"/>
  <rect x="115" y="425" width="220" height="8" fill="#bbbbbb"/>
  <rect x="115" y="440" width="180" height="8" fill="#bbbbbb"/>

  <!-- Section Title 2 -->
  <rect x="20" y="490" width="160" height="16" fill="#333333"/>

  <!-- Course Card Banner -->
  <rect x="20" y="520" width="340" height="110" fill="#f8f8f8" stroke="#cccccc" stroke-width="1.5"/>
  <rect x="35" y="535" width="200" height="14" fill="#444444"/>
  <rect x="35" y="558" width="300" height="8" fill="#aaaaaa"/>
  <rect x="35" y="572" width="260" height="8" fill="#aaaaaa"/>
  <rect x="35" y="590" width="100" height="28" rx="3" fill="#888888"/>

  <!-- Footer -->
  <rect x="20" y="650" width="340" height="70" fill="#e0e0e0" stroke="#888888" stroke-width="1.5"/>
  <rect x="35" y="668" width="120" height="10" fill="#666666"/>
  <rect x="35" y="688" width="200" height="8" fill="#888888"/>
  <circle cx="320" cy="685" r="8" fill="#888888"/>
  <circle cx="340" cy="685" r="8" fill="#888888"/>
</svg>
