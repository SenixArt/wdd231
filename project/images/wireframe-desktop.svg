<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <!-- Background Window Frame -->
  <rect x="10" y="10" width="880" height="630" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  
  <!-- Browser Header Controls -->
  <rect x="10" y="10" width="880" height="30" fill="#e8e8e8" stroke="#333333" stroke-width="1"/>
  <circle cx="30" cy="25" r="5" fill="#ff5f56"/>
  <circle cx="45" cy="25" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="25" r="5" fill="#27c93f"/>

  <!-- Navigation Header -->
  <rect x="30" y="55" width="840" height="50" fill="#f0f0f0" stroke="#666666" stroke-width="1.5"/>
  <rect x="50" y="67" width="130" height="26" fill="#333333"/>
  <text x="65" y="84" font-family="sans-serif" font-size="11" fill="#ffffff">[ Logo ]</text>
  <!-- Nav Menu Links -->
  <rect x="540" y="73" width="60" height="12" fill="#666666"/>
  <rect x="620" y="73" width="60" height="12" fill="#666666"/>
  <rect x="700" y="73" width="60" height="12" fill="#666666"/>
  <rect x="780" y="67" width="70" height="25" rx="3" fill="#444444"/>

  <!-- Hero Section -->
  <rect x="30" y="120" width="840" height="180" fill="#fafafa" stroke="#999999" stroke-width="1.5" stroke-dasharray="4"/>
  <!-- Text Content Left -->
  <rect x="60" y="150" width="320" height="22" fill="#333333"/>
  <rect x="60" y="185" width="380" height="10" fill="#aaaaaa"/>
  <rect x="60" y="202" width="340" height="10" fill="#aaaaaa"/>
  <rect x="60" y="219" width="280" height="10" fill="#aaaaaa"/>
  <rect x="60" y="245" width="130" height="35" rx="4" fill="#555555"/>
  <!-- Image Placeholder Right -->
  <rect x="500" y="140" width="340" height="140" fill="#e8e8e8" stroke="#cccccc" stroke-width="1"/>
  <line x1="500" y1="140" x2="840" y2="280" stroke="#cccccc" stroke-width="1"/>
  <line x1="840" y1="140" x2="500" y2="280" stroke="#cccccc" stroke-width="1"/>
  <text x="630" y="215" font-family="sans-serif" font-size="12" fill="#888888">[ Hero Image ]</text>

  <!-- Section Title 1 -->
  <rect x="30" y="320" width="180" height="18" fill="#333333"/>

  <!-- Product Cards Grid (3 Columns) -->
  <!-- Card 1 -->
  <rect x="30" y="350" width="260" height="160" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <rect x="30" y="350" width="260" height="90" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <line x1="30" y1="350" x2="290" y2="440" stroke="#dddddd" stroke-width="1"/>
  <line x1="290" y1="350" x2="30" y2="440" stroke="#dddddd" stroke-width="1"/>
  <rect x="45" y="452" width="140" height="12" fill="#444444"/>
  <rect x="45" y="472" width="200" height="8" fill="#bbbbbb"/>
  <rect x="45" y="485" width="160" height="8" fill="#bbbbbb"/>

  <!-- Card 2 -->
  <rect x="320" y="350" width="260" height="160" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <rect x="320" y="350" width="260" height="90" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <line x1="320" y1="350" x2="580" y2="440" stroke="#dddddd" stroke-width="1"/>
  <line x1="580" y1="350" x2="320" y2="440" stroke="#dddddd" stroke-width="1"/>
  <rect x="335" y="452" width="140" height="12" fill="#444444"/>
  <rect x="335" y="472" width="200" height="8" fill="#bbbbbb"/>
  <rect x="335" y="485" width="160" height="8" fill="#bbbbbb"/>

  <!-- Card 3 -->
  <rect x="610" y="350" width="260" height="160" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <rect x="610" y="350" width="260" height="90" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <line x1="610" y1="350" x2="870" y2="440" stroke="#dddddd" stroke-width="1"/>
  <line x1="870" y1="350" x2="610" y2="440" stroke="#dddddd" stroke-width="1"/>
  <rect x="625" y="452" width="140" height="12" fill="#444444"/>
  <rect x="625" y="472" width="200" height="8" fill="#bbbbbb"/>
  <rect x="625" y="485" width="160" height="8" fill="#bbbbbb"/>

  <!-- Footer -->
  <rect x="30" y="535" width="840" height="80" fill="#e0e0e0" stroke="#888888" stroke-width="1.5"/>
  <rect x="60" y="560" width="160" height="12" fill="#555555"/>
  <rect x="60" y="580" width="240" height="8" fill="#888888"/>
  <rect x="400" y="560" width="100" height="8" fill="#777777"/>
  <rect x="400" y="575" width="100" height="8" fill="#777777"/>
  <circle cx="800" cy="570" r="10" fill="#777777"/>
  <circle cx="830" cy="570" r="10" fill="#777777"/>
</svg>
