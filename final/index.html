<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mundo Creativo - Master frontend development, video editing, and digital design.">
    <meta name="author" content="Daniel Cosme">
    <title>Mundo Creativo | Home</title>
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Mundo Creativo | Digital Design & Development">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/hero.webp">
    <meta property="og:url" content="https://senixart.github.io/wdd231/final/index.html">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/final.css">
    <script type="module" src="scripts/main.js"></script>
</head>
<body>
    <header>
        <div class="logo">Mundo Creativo</div>
        <button id="menu-btn" aria-label="Open Navigation Menu">☰</button>
        <nav id="nav-bar">
            <a href="index.html" class="active">Home</a>
            <a href="courses.html">Courses</a>
            <a href="join.html">Join Us</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <img src="images/hero.webp" alt="Creative workstation" width="1200" height="500" loading="eager">
            <div class="hero-content">
                <h1>Build Your Creative Future</h1>
                <p>Master design, video production, and web frontend development.</p>
                <a href="courses.html" class="cta-btn">Explore 15+ Courses</a>
            </div>
        </section>

        <section class="visit-banner">
            <p id="visit-message"></p>
        </section>

        <section class="featured-courses">
            <h2>Top Rated Courses</h2>
            <div id="featured-grid" class="cards-grid"></div>
        </section>
    </main>

    <!-- Modal Dialog for Course Details -->
    <dialog id="course-dialog">
        <div class="dialog-content">
            <button id="close-modal" aria-label="Close Modal">&times;</button>
            <h2 id="modal-title"></h2>
            <p id="modal-category"></p>
            <p id="modal-level"></p>
            <p id="modal-duration"></p>
            <p id="modal-rating"></p>
            <p id="modal-description"></p>
        </div>
    </dialog>

    <footer>
        <p>&copy; 2026 | Daniel Cosme | WDD 231 Final Project</p>
        <p>
            <a href="attributions.html">Attributions</a> | 
            <a href="https://youtu.be/your-video-id" target="_blank" rel="noopener">Project Video Demo</a>
        </p>
    </footer>
</body>
</html>
