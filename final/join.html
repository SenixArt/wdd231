<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for courses at Mundo Creativo.">
    <meta name="author" content="Daniel Cosme">
    <title>Mundo Creativo | Join Us</title>

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/final.css">
    <script type="module" src="scripts/main.js"></script>
</head>
<body>
    <header>
        <div class="logo">Mundo Creativo</div>
        <button id="menu-btn" aria-label="Open Navigation Menu">☰</button>
        <nav id="nav-bar">
            <a href="index.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="join.html" class="active">Join Us</a>
        </nav>
    </header>

    <main class="form-container">
        <h1>Course Registration</h1>
        <form method="get" action="thank-you.html">
            <label for="fname">First Name <span class="required">*</span></label>
            <input type="text" id="fname" name="fname" required>

            <label for="lname">Last Name <span class="required">*</span></label>
            <input type="text" id="lname" name="lname" required>

            <label for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" name="email" required placeholder="user@example.com">

            <label for="phone">Phone <span class="required">*</span></label>
            <input type="tel" id="phone" name="phone" required>

            <label for="course-select">Select Course <span class="required">*</span></label>
            <select id="course-select" name="course" required>
                <option value="" disabled selected>Choose a track...</option>
                <option value="UI/UX & Mobile Wireframing">UI/UX & Mobile Wireframing</option>
                <option value="After Effects & Motion Graphics">After Effects & Motion Graphics</option>
                <option value="Dynamic Web Fundamentals">Dynamic Web Fundamentals</option>
                <option value="Advanced JavaScript Modules">Advanced JavaScript Modules</option>
            </select>

            <label for="timestamp">Submission Time</label>
            <input type="hidden" id="timestamp" name="timestamp">

            <input type="submit" value="Submit Registration" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 | Daniel Cosme | WDD 231 Final Project</p>
        <p>
            <a href="attributions.html">Attributions</a> | 
            <a href="https://youtu.be/your-video-id" target="_blank" rel="noopener">Project Video Demo</a>
        </p>
    </footer>
    <script>
        document.getElementById('timestamp').value = new Date().toISOString();
    </script>
</body>
</html>
